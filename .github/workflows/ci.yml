name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Daily run of the live tests, to catch registries changing their response formats.
  # (Scheduled runs only fire on the default branch.)
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build rdap.slnx -c Release -p:RdapRequireBootstrapSnapshot=true
      - run: dotnet test --project tests/Rdap.Tests -c Release --no-build

  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build tests/Rdap.IntegrationTests -c Release
      - run: dotnet test --project tests/Rdap.IntegrationTests -c Release --no-build

  publish:
    name: Publish
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
